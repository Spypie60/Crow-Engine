[package]
name = "crow_engine"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
jni = "0.22.4"
libloading = "0.9.0"
flate2 = "1.1.10"
lazy_static = "1.5.1"
anyhow  = "1.0.104"
tokio ={ version = "1.54.1", features = ["full"]}
zip = {version= "9.2.0", features = ["deflate"]}
rayon = "1.12.0"
wasmtime = "50.0.1"
crow_mixer = {path = "../crow_mixer"}

[lib]
crate-type = ["cdylib"]


[profile.dev]

[profile.release]
panic = "abort"
opt-level = 3

[package]
name = "crow_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
jni = "0.22.4"
libloading = "0.9.0"
flate2 = "1.1.0"
lazy_static = "1.4"
anyhow  = "1.0.104"
tokio ={ version = "1.53.1", features = ["full"]}
zip = {version= "8.6.0", features = ["deflate"]}
rayon = "1.12.0"
wasmtime = "47.0.3"
crow_mixer = {path = "../crow_mixer"}

[lib]
crate-type = ["cdylib"]


[profile.dev]

[profile.release]
panic = "abort"
opt-level = 3
